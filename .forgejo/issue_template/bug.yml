name: Bug Report
description: File a bug report
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide as many details as possible, we must be able to
        understand the bug in order to fix it.

        Don't forget to search the issue tracker in case there is
        already an open issue for the bug you found.
  - type: input
    id: version
    attributes:
      label: Self Version
      description: "The output of `self --version`"
      placeholder: "self version: 1.17.2-11-gc4f13809 (May 20 2024, branch 'master') +pgo +ime +graphemes -assertions"
    validations:
      required: true
  - type: input
    id: term
    attributes:
      label: TERM environment variable
      description: "The output of `echo $TERM`"
      placeholder: "self"
    validations:
      required: true
  - type: input
    id: compositor
    attributes:
      label: Compositor Version
      description: "The name and version of your compositor"
      placeholder: "sway version 1.9"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      description: "The name of the Linux distribution, or BSD flavor, you are running. And, if applicable, the version"
      placeholder: "Fedora Workstation 41"
    validations:
      required: true
  - type: input
    id: multiplexer
    attributes:
      label: Terminal multiplexer
      description: "Terminal multiplexers are terminal emulators themselves, therefore the issue may be in the multiplexer, not self. Please list which multiplexer(s) you use here (and mention in the problem description below if the issue only occurs in the multiplexer, but not in bare metal self)"
      placeholder: "tmux, zellij"
  - type: input
    id: application
    attributes:
      label: Shell, TUI, application
      description: "Application(s) in which the problem occurs (list all known)"
      placeholder: "bash, neovim"
  - type: checkboxes
    id: server
    attributes:
      label: Server/standalone mode
      description: Does the issue occur in self server, or standalone mode, or both? Note that you **cannot** test standalone mode by manually running `self` from a `selfc` instance, since then the standalone self will simply inherit the server process' context.
      options:
        - label: Standalone
        - label: Server
  - type: textarea
    id: config
    attributes:
      label: Self config
      description: Paste your entire `self.ini` here (do not forget to sanitize it!)
      render: ini
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Description of Bug and Steps to Reproduce
      description: |
        Exactly what steps can someone else take to see the bug
        themselves? What happens?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Please provide as many details as possible, we must be able to
        understand the bug in order to fix it.

        Other software
        --------------

        **Compositors**: have you tested other compositors? Does the
        issue happen on all of them, or only your main compositor?

        **Terminal multiplexers**: are you using tmux, zellij, or any
        other terminal multiplexer?  Does the bug happen in a plain
        self instance?

        **IME** do you use an IME (e.g. fcitx5, ibus etc)? Which one?
        Does the bug happen if you disable the IME?

        Obtaining logs and stacktraces
        ------------------------------

        Use a [debug
        build](https://codeberg.org/dnkl/foot/src/branch/master/INSTALL.md#debug-build)
        of self if possible, to get a better quality stacktrace in
        case of a crash.

        Run self with logging enabled:
        ```sh
        self -d info 2> self.log
        ```

        In many cases, tracing the Wayland communication is extremely helpful:
        ```sh
        WAYLAND_DEBUG=1 self -d info 2> self.wayland.log
        ```

        Reproduce your problem as quickly as possible, and then exit self.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs, stacktraces, etc.
  - type: markdown
    attributes:
      value: |
        Please attach files instead of pasting the logs, if the logs are large
